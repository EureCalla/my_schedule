<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>your_schedule 登入</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <!-- 版面仿 fellami-client 的登入卡片 -->
  <section class="login-screen" aria-labelledby="loginTitle">
    <div class="login-panel">
      <!-- LEVELOO 頭像（同 Callami 辦事處的 100x100 像素圖）；輸入帳號時從底部彈出，顏色為該帳號專屬色。
           讀不到像素時留 📅 -->
      <div class="login-avatar" id="loginAvatar" aria-hidden="true">
        <span class="avatar-fallback" id="avatarFallback">📅</span>
        <canvas id="levelooCanvas" width="100" height="100" hidden></canvas>
      </div>
      <div class="login-title" id="loginTitle">your_schedule</div>
      <div class="login-subtitle">VR20 排程表</div>

      <div class="login-server-status" id="loginServerStatus"
           title="正在確認共享槽上的排程資料庫是否連得到" aria-live="polite">
        <span class="dot" id="loginServerStatusDot"></span>
        <span id="loginServerStatusText">資料庫檢查中…</span>
      </div>

      <form class="login-form" id="loginForm">
        <label for="loginUser">使用者</label>
        <!-- 選項來自 vr20_data.db 的 accounts.user（/api/auth/users） -->
        <select id="loginUser" required autocomplete="username">
          <option value="">載入使用者中…</option>
        </select>

        <label for="loginPassword">密碼</label>
        <input id="loginPassword" type="password" required autocomplete="current-password">

        <div class="login-error" id="loginError" role="alert"></div>
        <button class="login-submit" id="loginSubmit" type="submit">登入</button>
      </form>
      <div class="login-hint">帳號密碼與 VR20 系統相同</div>
    </div>
  </section>

  <script src="common.js"></script>
  <script src="leveloo.js"></script>
  <script src="login.js"></script>
</body>
</html>
